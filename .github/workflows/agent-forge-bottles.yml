name: Agent Forge bottles
run-name: Agent Forge bottles ${{ inputs.verification_sha || github.sha }}

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification_branch:
        description: Exact bump branch containing only Formula/agent-forge.rb
        required: true
        type: string
      verification_sha:
        description: Exact bump branch commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact verifier revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact Formula verification request
        if: github.event_name == 'workflow_dispatch'
        env:
          VERIFICATION_BRANCH: ${{ inputs.verification_branch }}
          VERIFICATION_SHA: ${{ inputs.verification_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "0k-lab/homebrew-tap"
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$VERIFICATION_BRANCH" in bump/agent-forge-v*) ;; *) exit 1 ;; esac
          test "${#VERIFICATION_SHA}" = 40
          case "$VERIFICATION_SHA" in *[!0-9a-f]*) exit 1 ;; esac
          remote_sha="$(git ls-remote --heads origin "refs/heads/$VERIFICATION_BRANCH" | cut -f1)"
          test "$remote_sha" = "$VERIFICATION_SHA"
          git -c http.proxy= -c https.proxy= fetch --no-tags origin "+refs/heads/$VERIFICATION_BRANCH:refs/remotes/origin/verification-head"
          test "$(git rev-parse refs/remotes/origin/verification-head)" = "$VERIFICATION_SHA"
          parent_line="$(git rev-list --parents -n1 "$VERIFICATION_SHA")"
          test "$(wc -w <<<"$parent_line" | tr -d ' ')" = 2
          parent_sha="$(cut -d' ' -f2 <<<"$parent_line")"
          git merge-base --is-ancestor "$parent_sha" "$GITHUB_SHA"
          git diff-tree --no-commit-id --name-only -r "$VERIFICATION_SHA" > verification-files.txt
          cmp verification-files.txt <(printf '%s\n' Formula/agent-forge.rb)
          git show "$VERIFICATION_SHA:Formula/agent-forge.rb" > "$RUNNER_TEMP/agent-forge.rb"
          ruby -c "$RUNNER_TEMP/agent-forge.rb"

      - name: Run automation contracts
        run: |
          set -euo pipefail
          python3 -c 'import yaml' || { echo "PyYAML is required" >&2; exit 1; }
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m py_compile scripts/agent_forge_bump.py tests/test_agent_forge_formula_bump.py
          if command -v ruby >/dev/null; then ruby -c Formula/agent-forge.rb; fi
          git diff --check
          git diff --exit-code

  bottle:
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out exact verifier revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact Formula verification head
        if: github.event_name == 'workflow_dispatch'
        env:
          VERIFICATION_BRANCH: ${{ inputs.verification_branch }}
          VERIFICATION_SHA: ${{ inputs.verification_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "0k-lab/homebrew-tap"
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$VERIFICATION_BRANCH" in bump/agent-forge-v*) ;; *) exit 1 ;; esac
          test "${#VERIFICATION_SHA}" = 40
          case "$VERIFICATION_SHA" in *[!0-9a-f]*) exit 1 ;; esac
          remote_sha="$(git ls-remote --heads origin "refs/heads/$VERIFICATION_BRANCH" | cut -f1)"
          test "$remote_sha" = "$VERIFICATION_SHA"
          git -c http.proxy= -c https.proxy= fetch --no-tags origin "+refs/heads/$VERIFICATION_BRANCH:refs/remotes/origin/verification-head"
          test "$(git rev-parse refs/remotes/origin/verification-head)" = "$VERIFICATION_SHA"
          parent_line="$(git rev-list --parents -n1 "$VERIFICATION_SHA")"
          test "$(wc -w <<<"$parent_line" | tr -d ' ')" = 2
          parent_sha="$(cut -d' ' -f2 <<<"$parent_line")"
          git merge-base --is-ancestor "$parent_sha" "$GITHUB_SHA"
          git diff-tree --no-commit-id --name-only -r "$VERIFICATION_SHA" > verification-files.txt
          cmp verification-files.txt <(printf '%s\n' Formula/agent-forge.rb)
          git show "$VERIFICATION_SHA:Formula/agent-forge.rb" > Formula/agent-forge.rb
          test "$(git hash-object Formula/agent-forge.rb)" = "$(git rev-parse "$VERIFICATION_SHA:Formula/agent-forge.rb")"
          ruby -c Formula/agent-forge.rb

      - name: Read exact Formula identity
        id: identity
        run: python3 scripts/agent_forge_bump.py formula-identity --formula Formula/agent-forge.rb --github-output "$GITHUB_OUTPUT"

      - name: Tap checked-out repository
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          tap_dir="$(brew --repository)/Library/Taps/0k-lab/homebrew-tap"
          test ! -e "$tap_dir"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

      - name: Audit and prove remote bottle
        run: |
          set -euo pipefail
          brew audit --strict 0k-lab/tap/agent-forge
          brew install --force-bottle 0k-lab/tap/agent-forge
          brew test 0k-lab/tap/agent-forge
          test "$(forge-worker --version)" = "forge-worker ${{ steps.identity.outputs.tag }} ${{ steps.identity.outputs.commit }}"
          test "$(forge-codex-plugin --version)" = "forge-codex-plugin ${{ steps.identity.outputs.tag }} ${{ steps.identity.outputs.commit }}"
          test "$(forge-ref-plugin --version)" = "forge-ref-plugin ${{ steps.identity.outputs.tag }} ${{ steps.identity.outputs.commit }}"
          test ! -e "$(brew --prefix)/bin/forge-gate"
          brew info --json=v2 0k-lab/tap/agent-forge | ruby -rjson -e 'abort "not poured from bottle" unless JSON.parse(STDIN.read).fetch("formulae").first.fetch("installed").any? { |install| install["poured_from_bottle"] == true }'
