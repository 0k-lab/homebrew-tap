name: Agent Forge bottles

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bottle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Tap checked-out repository
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          tap_dir="$(brew --repository)/Library/Taps/0k-lab/homebrew-tap"
          test ! -e "$tap_dir"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

      - name: Audit and prove remote bottle
        run: |
          brew audit --strict 0k-lab/tap/agent-forge
          brew install --force-bottle 0k-lab/tap/agent-forge
          brew test 0k-lab/tap/agent-forge
          test "$(forge-worker --version)" = "forge-worker v0.1.7 ee034b53b5af660cfca66985959b566ecfdd0f73"
          test "$(forge-codex-plugin --version)" = "forge-codex-plugin v0.1.7 ee034b53b5af660cfca66985959b566ecfdd0f73"
          test "$(forge-ref-plugin --version)" = "forge-ref-plugin v0.1.7 ee034b53b5af660cfca66985959b566ecfdd0f73"
          brew info --json=v2 0k-lab/tap/agent-forge | ruby -rjson -e 'abort "not poured from bottle" unless JSON.parse(STDIN.read).fetch("formulae").first.fetch("installed").any? { |install| install["poured_from_bottle"] == true }'
